[project]
name = "pokedex"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.15.0",
    "pydantic-settings>=2.16.0",
    "pypokeclient>=2.3.0",
    "rich>=15.0.0",
    "sentence-transformers>=6.2.0",
    "typer>=0.27.3",
]

[project.scripts]
pokedex = "pokedex:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.mypy]
plugins = ["pydantic.mypy"]
